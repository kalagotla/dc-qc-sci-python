[project]
name = "dc-qc-sci-python"
version = "0.1.0"
description = "Scientific Python for Engineers Workshop - DC-QC Series"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Dilip Kalagotla", email = "dilip.kalagotla@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "jupyterlab>=4.0.0",
    "notebook>=7.0.0",
    "seaborn>=0.12.0",
    "ipywidgets>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["hour3_ml/simple_dnns"]
